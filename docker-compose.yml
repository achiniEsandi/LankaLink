services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    # MONGO_URI (MongoDB Atlas), JWT_SECRET etc. come from backend/.env, never from this file
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      CLIENT_URL: http://localhost:${FRONTEND_PORT:-5173}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      # Keep the container's Linux node_modules instead of the host's
      - /app/node_modules

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
