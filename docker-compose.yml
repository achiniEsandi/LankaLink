services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    depends_on:
      - mongo
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/lankalink
      CLIENT_URL: http://localhost:${FRONTEND_PORT:-5173}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_EXPIRES_IN: 7d
      # Set these in a root .env file (kept out of Git) to send real email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-LankaLink <no-reply@lankalink.lk>}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      # Keep the container's Linux node_modules instead of the host's
      - /app/node_modules

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:5000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo-data:
